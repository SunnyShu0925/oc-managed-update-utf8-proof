name: managed-update-utf8-proof

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: Published stable driver version
        required: true
        default: "2026.10.8"
      candidate_version:
        description: Reviewed driver build version
        required: true
        default: "2026.10.9"
      base_target_version:
        description: Published target for the baseline scenario
        required: true
        default: "2026.10.10-beta.3"
      fix_target_version:
        description: Reviewed next build used as the second target
        required: true
        default: "2026.10.10"

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: fix/update-managed-service-handoff-lossy-utf8
          fetch-depth: 1

      - name: Setup Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack install
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build the reviewed next release artifact
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.TARGET_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog \
            --output-dir "$RUNNER_TEMP/pkg" --output-name "openclaw-$TARGET_VERSION.tgz"
          git checkout -- package.json
        env:
          TARGET_VERSION: ${{ inputs.fix_target_version }}

      - name: Pack the reviewed driver build
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.DRIVER_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog --skip-build \
            --output-dir "$RUNNER_TEMP/pkg" --output-name "openclaw-$DRIVER_VERSION.tgz"
          git checkout -- package.json
          ls -l "$RUNNER_TEMP/pkg"
        env:
          DRIVER_VERSION: ${{ inputs.candidate_version }}

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidate-artifacts
          path: ${{ runner.temp }}/pkg/openclaw-*.tgz
          if-no-files-found: error

  proof:
    needs: build-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: baseline
            port: 18833
          - scenario: fix
            port: 18834
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v4

      - name: Setup Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Download reviewed candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: candidate-artifacts
          path: /tmp/candidate-artifacts

      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "npm_config_prefix=$HOME/.npm-global" >> "$GITHUB_ENV"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          sleep 2
          sudo systemctl restart "user@$(id -u).service"
          sleep 3
          systemctl --user is-system-running || true
          systemctl --user start dbus.socket 2>/dev/null || true
          busctl --user list | grep -E "org.freedesktop.systemd1" || echo "systemd1 not on the user bus"

      - name: Report reviewed build identity
        run: |
          echo "proof harness head: $(git rev-parse HEAD)"

      - name: Run the managed update proof (${{ matrix.scenario }})
        env:
          SCENARIO: ${{ matrix.scenario }}
          GATEWAY_PORT: ${{ matrix.port }}
          TARBALL_DIR: /tmp/candidate-artifacts
          STABLE_VERSION: ${{ inputs.stable_version }}
          CAND_VERSION: ${{ inputs.candidate_version }}
          BASE_TARGET_VERSION: ${{ inputs.base_target_version }}
          FIX_TARGET_VERSION: ${{ inputs.fix_target_version }}
        run: bash "$GITHUB_WORKSPACE/scripts/proof.sh"

      - name: Upload proof logs (${{ matrix.scenario }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-logs-${{ matrix.scenario }}
          path: |
            /tmp/update.json
            /tmp/update.json.err
            /tmp/update.json.rc
            /tmp/run-update.sh
            /tmp/cron-add.err
            /tmp/gateway-status.json
            /tmp/gateway-status-after.json
            /tmp/cron-before.json
            /tmp/cron-after.json
            /tmp/proof-summary.txt
            /tmp/handoff.log
            /tmp/inject-gateway.log
            /tmp/registry.log
            /home/runner/.openclaw/update-reports/*.md
          if-no-files-found: warn
