name: managed-update-utf8-proof

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: Published stable driver version
        required: true
        default: "2026.10.8"
      candidate_version:
        description: Published target version carrying the reviewed candidate
        required: true
        default: "2026.10.10-beta.4"
      driver_version:
        description: Earlier version used to build the reviewed driver package
        required: true
        default: "2026.10.9"
      artifacts_run_id:
        description: Reuse the proof artifacts of an earlier run instead of rebuilding
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-artifacts:
    if: ${{ inputs.artifacts_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout reviewed PR head
        uses: actions/checkout@v4
        with:
          repository: SunnyShu0925/openclaw
          ref: fix/update-managed-service-handoff-lossy-utf8
          fetch-depth: 1

      - name: Setup Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Install workspace dependencies
        run: |
          corepack enable
          corepack install
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build the reviewed candidate package
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.TARGET_VERSION;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog \
            --output-dir "$RUNNER_TEMP/pkg-candidate" --output-name "openclaw-$TARGET_VERSION.tgz"
          git checkout -- package.json
        env:
          TARGET_VERSION: ${{ inputs.candidate_version }}

      - name: Record the reviewed build identity
        run: |
          git rev-parse --short=7 HEAD > "$RUNNER_TEMP/reviewed-build-id.txt"
          cat "$RUNNER_TEMP/reviewed-build-id.txt"
          cp "$RUNNER_TEMP/reviewed-build-id.txt" "$RUNNER_TEMP/pkg-candidate/"

      - name: Package the reviewed candidate as a self-contained install
        run: |
          rm -rf "$RUNNER_TEMP/sc" "$RUNNER_TEMP/scpkg" "$RUNNER_TEMP/pkg-selfcontained"
          npm install --prefix "$RUNNER_TEMP/sc" --no-audit --no-fund --ignore-scripts \
            "$RUNNER_TEMP/pkg-candidate/openclaw-$CANDIDATE_VERSION.tgz"
          mkdir -p "$RUNNER_TEMP/scpkg/package"
          cp -a "$RUNNER_TEMP/sc/node_modules/openclaw/." "$RUNNER_TEMP/scpkg/package/"
          mkdir -p "$RUNNER_TEMP/scpkg/package/node_modules"
          for entry in "$RUNNER_TEMP"/sc/node_modules/*; do
            name=$(basename "$entry")
            if [ "$name" = "openclaw" ]; then continue; fi
            cp -a "$entry" "$RUNNER_TEMP/scpkg/package/node_modules/"
          done
          node - "$RUNNER_TEMP/scpkg/package/package.json" <<'NODE'
          const fs = require("node:fs");
          const file = process.argv[2];
          const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
          pkg.dependencies = {};
          delete pkg.optionalDependencies;
          delete pkg.peerDependencies;
          pkg.bundleDependencies = [];
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          NODE
          mkdir -p "$RUNNER_TEMP/pkg-selfcontained"
          tar -czf "$RUNNER_TEMP/pkg-selfcontained/openclaw-$CANDIDATE_VERSION.tgz" \
            -C "$RUNNER_TEMP/scpkg" package
          cp "$RUNNER_TEMP/reviewed-build-id.txt" "$RUNNER_TEMP/pkg-selfcontained/"
          ls -l "$RUNNER_TEMP/pkg-selfcontained"
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: proof-artifacts
          path: |
            ${{ runner.temp }}/pkg-selfcontained/openclaw-*.tgz
            ${{ runner.temp }}/pkg-selfcontained/reviewed-build-id.txt
          if-no-files-found: error

  proof:
    needs: build-artifacts
    if: ${{ !cancelled() && (inputs.artifacts_run_id != '' || needs.build-artifacts.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: stable-driver
            port: 18833
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v4

      - name: Setup Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Download proof artifacts (this run)
        if: ${{ inputs.artifacts_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: proof-artifacts
          path: /tmp/proof-download

      - name: Download proof artifacts (earlier run)
        if: ${{ inputs.artifacts_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.artifacts_run_id }}" --repo "$GITHUB_REPOSITORY" --name proof-artifacts -D /tmp/proof-download

      - name: Flatten artifacts
        run: |
          mkdir -p /tmp/proof-artifacts
          cp /tmp/proof-download/*/openclaw-*.tgz /tmp/proof-artifacts/
          cp /tmp/proof-download/*/reviewed-build-id.txt /tmp/proof-artifacts/
          ls -l /tmp/proof-artifacts

      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "npm_config_prefix=$HOME/.npm-global" >> "$GITHUB_ENV"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          sleep 2
          sudo systemctl restart "user@$(id -u).service"
          sleep 3
          systemctl --user is-system-running || true
          systemctl --user start dbus.socket 2>/dev/null || true
          busctl --user list | grep -E "org.freedesktop.systemd1" || echo "systemd1 not on the user bus"

      - name: Report reviewed build identity
        run: |
          echo "proof harness head: $(git rev-parse HEAD)"
          cat /tmp/proof-artifacts/reviewed-build-id.txt

      - name: Run the managed update proof (${{ matrix.scenario }})
        env:
          SCENARIO: ${{ matrix.scenario }}
          GATEWAY_PORT: ${{ matrix.port }}
          ARTIFACT_DIR: /tmp/proof-artifacts
          STABLE_VERSION: ${{ inputs.stable_version }}
          CAND_VERSION: ${{ inputs.candidate_version }}
          DRIVER_VERSION: ${{ inputs.driver_version }}
        run: bash "$GITHUB_WORKSPACE/scripts/proof.sh"

      - name: Upload proof logs (${{ matrix.scenario }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-logs-${{ matrix.scenario }}
          path: |
            /tmp/update.json
            /tmp/update.json.err
            /tmp/update.json.rc
            /tmp/run-update.sh
            /tmp/cron-add.err
            /tmp/gateway-status.json
            /tmp/gateway-status-after.json
            /tmp/cron-before.json
            /tmp/cron-after.json
            /tmp/proof-summary.txt
            /tmp/handoff.log
            /tmp/inject-gateway.log
            /tmp/registry.log
            /tmp/registry.out
            /home/runner/.openclaw/update-reports/*.md
            /home/runner/.openclaw/logs/support/*.json
          if-no-files-found: warn
