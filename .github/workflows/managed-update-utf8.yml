name: managed-update-utf8-proof

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: Published driver version to upgrade from
        required: true
        default: "2026.10.8"
      candidate_a_version:
        description: Reviewed candidate version (first upgrade target)
        required: true
        default: "2026.10.9"
      candidate_b_version:
        description: Follow-up candidate version (second upgrade target)
        required: true
        default: "2026.10.10"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout proof harness
        uses: actions/checkout@v4

      - name: Setup Node 24.22.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Start the systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          echo "npm_config_prefix=$HOME/.npm-global" >> "$GITHUB_ENV"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          sleep 2
          # Restart once the bus socket exists so the manager registers on it
          # (the managed-service inspection needs org.freedesktop.systemd1).
          sudo systemctl restart "user@$(id -u).service"
          sleep 3
          systemctl --user is-system-running || true
          systemctl --user start dbus.socket 2>/dev/null || true
          systemctl --user is-active dbus.socket 2>/dev/null || true
          busctl --user list | grep -E "org.freedesktop.systemd1" || echo "systemd1 not on the user bus"

      - name: Report reviewed build identity
        run: |
          echo "proof harness head: $(git rev-parse HEAD)"
          curl -fsSL "$GITHUB_API_URL/repos/SunnyShu0925/openclaw/commits/fix/update-managed-service-handoff-lossy-utf8" \
            | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{const c=JSON.parse(s);console.log(`reviewed PR head: ${c.sha} ${c.commit?.message?.split("\n")[0]}`)})'

      - name: Run the published-driver to candidate managed upgrades
        env:
          STABLE_VERSION: ${{ inputs.stable_version }}
          CAND_A_VERSION: ${{ inputs.candidate_a_version }}
          CAND_B_VERSION: ${{ inputs.candidate_b_version }}
        run: bash "$GITHUB_WORKSPACE/scripts/proof.sh"

      - name: Upload proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-logs
          path: |
            /tmp/update-runA.json
            /tmp/update-runA.err
            /tmp/update-runB.json
            /tmp/update-runB.err
            /tmp/inject-runA.log
            /tmp/inject-runB.log
            /tmp/run-update-runA.sh
            /tmp/run-update-runB.sh
            /tmp/gateway-status.json
            /tmp/gateway-status-after.json
            /tmp/cron-before.json
            /tmp/cron-after-a.json
            /tmp/proof-summary.txt
            /tmp/registry-a.log
            /tmp/registry-b.log
            /tmp/inject-gateway.log
            /tmp/handoff-runA.log
            /tmp/handoff-runB.log
            /tmp/cron-add-runA.err
            /tmp/cron-add-runB.err
            /home/runner/.openclaw/update-reports/*.md
          if-no-files-found: warn
